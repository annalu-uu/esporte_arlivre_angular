<section id="section-lista-Atleta">
    <h2>Listar Atletas</h2>

    @for(elem of listaAtletas(); track elem.id) {
        <div class="atleta-item">
            <span class="span-dados-atleta">
                {{elem.id}} - {{ elem.nome }} - {{ elem.cpf }} - {{elem.cidade }} / {{ elem.uf }}
            </span>
            <span class="span-lnk-atletas">
                <a class="lnk-atleta lnk-alterar" (click)="carregaDadosAtletaForm(elem)">Alterar</a>
                <a class="lnk-atleta lnk-excluir" (click)="excluir(elem.id)">Excluir</a>
            </span>
        </div>
    }@empty{
        <div class="div-item-pessoa">
            NENHUM REGISTRO NA LISTA
        </div> 
    }
</section>
